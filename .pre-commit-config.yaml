repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9.0
          - pyyaml>=6.0.2
          - cryptography>=43.0.0
          - PyJWT>=2.9.0
          - types-PyYAML>=6.0
          - pytest>=8.3
          - rich>=13.9.0
