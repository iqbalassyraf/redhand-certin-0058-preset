# RedHand preset: CERT-In CIAD-2026-0058 (CRAFTY FALCON) + CIAD-2026-0049 (AI Agents as Attack Vectors)
#
# Monetary values are QUOTED STRINGS on purpose: YAML floats are rejected by the schema.
# Currency thresholds are static, per currency, and must be reviewed by the operator.
# Unknown currencies fail CLOSED (treated as a probe candidate and as above the HITL threshold).

preset_id: certin_ciad_2026_0058
mode: enforce                     # enforce | observe_only (RedHand M4.3)

# --- Overlays ---------------------------------------------------------------------------------
# An operator policy can `extends: certin_ciad_2026_0058` instead of copying this file. An overlay
# may only TIGHTEN this policy; loosening a limit needs an explicit `loosen: [field.path, ...]`
# entry, and the fields below can never be loosened. See README "Composable policies".
locked:
  - quarantine_on_block
  - tool_bindings.require_for_protected
  - hitl.protected_tools
  - off_hours.enabled

# --- Identity (CIAD-2026-0049: separate, short-lived, least-privilege identity per agent run) ---
issuer: redhand
max_token_ttl_seconds: 3600       # tokens with exp - iat above this are rejected
# verifier_public_key_path: keys/redhand_ed25519_public.pem   # or inject a verifier in code

# --- Stage 2: micro-transaction probing loop ---
micro_tx:
  ceilings:                       # amount <= ceiling counts as a probe (~USD 5.00)
    USD: "5.00"
    INR: "450"
    MYR: "25"
    SGD: "7"
  max_probes: 2                   # circuit breaker trips on the 2nd probe...
  window_seconds: 60              # ...inside this sliding window

# --- Stage 2: machine-speed enumeration bursts, keyed by (agent run, tool) ---
velocity:
  max_calls: 20                   # per (agent run, tool)
  max_total_calls: 40             # per agent run across ALL tools, so rotating tools does not help
  window_seconds: 1

# --- Stage 3: merchant settlement & disbursement API abuse ---
hitl:
  thresholds:                     # HITL step-up required when amount is strictly above
    USD: "10000"
    INR: "900000"
    MYR: "45000"
    SGD: "13500"
  protected_tools:
    - settle_merchant
    - initiate_disbursement
    - bulk_payout

# --- Stage 4: low-monitoring windows ---
off_hours:
  enabled: true
  timezone: Asia/Kolkata
  business_hours: [9, 18]         # local hours [start, end)
  weekend_days: [5, 6]            # Saturday, Sunday
  tighten_factor: 0.5             # halves probe/velocity limits and HITL thresholds
  mandatory_hitl: true            # protected tools always need HITL off-hours
  # Fixed-date Indian public holidays only. Movable festivals (Diwali, Holi, Eid, ...) and
  # state/bank holidays differ every year: the OPERATOR must add them.
  holidays:
    - 2026-01-26                  # Republic Day
    - 2026-08-15                  # Independence Day
    - 2026-10-02                  # Gandhi Jayanti
    - 2026-12-25                  # Christmas Day

# --- Stage 2: split-transaction structuring (smurfing) across protected endpoints ---
# Prevents an attacker from splitting a large disbursement into sub-HITL chunks inside 5 minutes.
# Scoped to settlement/disbursement tools so high-volume low-risk card charges are unaffected.
structuring:
  enabled: true
  protected_tools:
    - settle_merchant
    - initiate_disbursement
    - bulk_payout
  thresholds:                     # cumulative amount strictly above triggers block + quarantine
    USD: "10000"
    INR: "900000"
    MYR: "45000"
    SGD: "13500"
  window_seconds: 300
  min_tx_count: 2                 # single large tx routes to HITL rather than structuring
  scopes: [run, subject, beneficiary]   # also add up per token subject and per payee ACROSS runs
  # max_keys: 100000              # windows kept; beyond it the call fails closed

# --- Stage 3: unseen/new beneficiary high-value disbursement gate ---
# Requires HITL step-up when funds are routed to a beneficiary not in known_beneficiaries.
new_beneficiary:
  enabled: true
  thresholds:                     # lower than general HITL (~USD 1,000) to catch mule diversion
    USD: "1000"
    INR: "90000"
    MYR: "4500"
    SGD: "1350"
  known_beneficiaries: []         # operator populates pre-vetted payout beneficiaries
  action: hitl_required           # hitl_required | block

# --- Stage 2: reconnaissance-to-payment kill-chain sequence ---
# Blocks automated discovery bursts (>= 3 recon calls) immediately followed by a payout call.
sequence:
  enabled: true
  recon_tools:
    - list_merchants
    - get_account
    - list_beneficiaries
  payment_tools:
    - settle_merchant
    - initiate_disbursement
    - bulk_payout
  min_recon_calls: 3
  window_seconds: 30

# --- Cross-currency aggregation: static, operator-reviewed rates (units of USD per 1 unit) ---
# Structuring and the cumulative caps add payments up in the base currency, so splitting a payout
# across currencies does not evade them. These rates are APPROXIMATIONS implied by the thresholds
# in this file (USD 10,000 ~ INR 900,000 ~ MYR 45,000 ~ SGD 13,500); the operator must review them.
# A currency without a rate cannot be converted and is judged in its own currency (fail-closed).
aggregation:
  base_currency: USD
  rates:
    INR: "0.0111"
    MYR: "0.2222"
    SGD: "0.7407"

# --- Stage 2: slow drain. A rolling cap on what one run, and one subject, may move ---
# A payment that would take the total over a cap needs per-transaction step-up (or is blocked and
# the run and subject quarantined, with action: block). Refused payments are not counted.
cumulative_cap:
  enabled: true
  protected_tools:
    - settle_merchant
    - initiate_disbursement
    - bulk_payout
  window_seconds: 86400           # rolling 24 hours
  per_run:
    USD: "50000"
    INR: "4500000"
    MYR: "225000"
    SGD: "67500"
  per_subject:                    # across every run of one token subject
    USD: "200000"
    INR: "18000000"
    MYR: "900000"
    SGD: "270000"
  action: hitl_required           # hitl_required | block

# --- Argument bindings: where each tool keeps its amount, currency and payee(s) ---
# The money rules judge the bound fields only. A tool that names its fields differently, or pays a
# list of payees, needs an entry here (paths: "payee.vpa", "payments[*].amount"; lists are summed and
# every payee is checked). Tools without an entry use the conventional names while legacy_fallback
# is true. require_for_protected refuses to load a policy that leaves a protected tool unbound.
tool_bindings:
  legacy_fallback: true
  require_for_protected: true
  tools:
    settle_merchant:
      amount: amount
      currency: currency
      beneficiary: beneficiary
    initiate_disbursement:
      amount: amount
      currency: currency
      beneficiary: beneficiary
    bulk_payout:                  # single-payment shape; add a "payments[*]" entry for list shapes
      amount: amount
      currency: currency
      beneficiary: beneficiary

# --- Per-transaction step-up: signed, single-use approvals (replaces the run-wide hitl_step_up) ---
# An approval names the run, tool, environment, amount, currency, every payee and a digest of the
# exact arguments, expires within max_ttl_seconds and can be spent once. It is signed by an
# APPROVER key that must differ from the agent-token key. Generate one with
# `redhand-shield keygen --name approver`, then set verifier_public_key_path.
approval:
  issuer: redhand-approver
  max_ttl_seconds: 300
  # verifier_public_key_path: keys/approver_ed25519_public.pem
  nonce_journal_path: approval_nonces.jsonl   # spent nonces survive a restart
  allow_legacy_step_up: true      # DEPRECATED run-wide hitl_step_up token claim; set false once
                                  # your approvers issue per-transaction approvals

# --- Containment & evidence (CIAD-2026-0049: tamper-resistant logs, retain 180+ days) ---
quarantine_on_block: true
quarantine_journal_path: quarantine.jsonl   # replayed on startup so a crash does not free an agent
audit_path: audit_trail.jsonl
audit_fsync: false                # true = fsync every record (stricter durability, slower)
