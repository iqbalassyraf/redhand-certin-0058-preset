name: Security vulnerability
description: Report a security vulnerability privately
body:
  - type: markdown
    attributes:
      value: |
        ## :lock: Security Vulnerabilities Must Be Reported Privately

        **Please do NOT submit security vulnerabilities through public GitHub issues.**

        To report a security vulnerability responsibly:
        1. Go directly to our [Private Vulnerability Reporting Form](https://github.com/iqbalassyraf/redhand-certin-0058-preset/security/advisories/new).
        2. Provide detailed reproduction steps or a minimal proof of concept (PoC).
        3. See [SECURITY.md](https://github.com/iqbalassyraf/redhand-certin-0058-preset/blob/main/SECURITY.md) for full response SLA and disclosure policies.
