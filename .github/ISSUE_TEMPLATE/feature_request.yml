name: Feature request
description: Suggest an idea or enhancement for redhand-certin-0058-preset
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please consult [UPGRADE.md](https://github.com/iqbalassyraf/redhand-certin-0058-preset/blob/main/UPGRADE.md) to check if your suggestion aligns with the project principles and phased roadmap.
        **Note:** Non-deterministic ML models in the decision path and fleet-scale features are explicitly non-goals for this core library.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Is your feature request related to a problem or regulatory requirement? Please describe.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have evaluated.
