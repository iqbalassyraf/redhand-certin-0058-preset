name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: read-all

jobs:
  build:
    name: Build distributions, SBOM, and provenance attestations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          path: ./dist
          format: spdx-json
          output-file: ./sbom/redhand_certin_0058_preset.spdx.json

      - name: Generate Sigstore build provenance attestations
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: "dist/*"

      - name: Upload distribution packages artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: distribution-packages
          path: dist/*
          if-no-files-found: error

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sbom-artifact
          path: sbom/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI via Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/redhand-certin-0058-preset
    permissions:
      id-token: write # Required for PyPI OIDC Trusted Publishing

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: distribution-packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7f25271a4aa483500f742f9492b2ab5648d61011 # v1.12.4
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release with assets
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create release and upload assets

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: distribution-packages
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: sbom-artifact
          path: sbom/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@d5382d3e6f2fa7bd53cb749d33091853d4985daf # v2.3.0
        with:
          files: |
            dist/*
            sbom/*
          generate_release_notes: true
