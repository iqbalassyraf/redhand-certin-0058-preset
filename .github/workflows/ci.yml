name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint and format checks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv run --python ${{ matrix.python-version }} ruff check .
          uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Type checking (strict)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run --python ${{ matrix.python-version }} mypy

      - name: Run test suite with coverage floor
        env:
          REDHAND_LATENCY_BUDGET_MS: "5.0"
        run: uv run --python ${{ matrix.python-version }} pytest

  smoke-test:
    name: wheel-build-and-smoke-test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Build distribution packages
        run: uv build

      - name: Install wheel into isolated clean virtual environment
        run: |
          python -m venv /tmp/smoke-env
          /tmp/smoke-env/bin/pip install dist/*.whl

      - name: Run quickstart smoke test (without optional demo dependencies)
        run: |
          /tmp/smoke-env/bin/python -c "
          from redhand_fintech_shield import (
              Shield,
              load_policy,
              AgentTokenIssuer,
              AgentTokenVerifier,
              ToolCallContext,
              Env,
              redhand_guard,
          )
          private, public = AgentTokenIssuer.generate_keypair()
          shield = Shield(load_policy(), AgentTokenVerifier(public))
          @redhand_guard(shield)
          def ping(*, ctx: ToolCallContext) -> str:
              return 'pong'
          token = AgentTokenIssuer(private).mint(
              subject='smoke-svc',
              agent_run_id='smoke-1',
              env=Env.PROD,
              allowed_tools=['ping'],
          )
          res = ping(ctx=ToolCallContext(
              agent_run_id='smoke-1',
              tool_name='ping',
              target_env=Env.PROD,
              token=token,
          ))
          assert res == 'pong', f'expected pong, got {res}'
          print('Clean wheel install-and-import smoke test: SUCCESS')
          "
