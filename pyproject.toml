[project]
name = "redhand-certin-0058-preset"
version = "0.1.0"
description = "Deterministic runtime interceptor preset for RedHand and standalone toolkit defending against CERT-In CIAD-2026-0058 (CRAFTY FALCON) and CIAD-2026-0049."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ARCHTIFICIAL Sdn. Bhd." }]
keywords = ["security", "ai-agents", "cert-in", "fintech", "zero-trust", "redhand"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "cryptography>=43.0.0",
    "PyJWT>=2.9.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
demo = ["rich>=13.9.0"]

[project.scripts]
redhand-certin-0058 = "redhand_fintech_shield.__main__:main"

[dependency-groups]
dev = [
    "rich>=13.9.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redhand_fintech_shield"]

[tool.hatch.build.targets.wheel.shared-data]
"presets" = "share/redhand-certin-0058-preset/presets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=redhand_fintech_shield --cov-report=term-missing"

[tool.coverage.run]
source = ["src/redhand_fintech_shield"]

[tool.coverage.report]
fail_under = 97
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "C4", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
"examples/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "examples"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
